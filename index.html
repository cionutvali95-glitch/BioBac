<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BioBAC">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>BioBAC</title>
<style>
:root{--green:#174b3d;--mint:#d9eee4;--bg:#f4f7f5;--ink:#20352e;--muted:#687b74;--white:#fff;--line:#e0e9e4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{background:var(--green);color:white;padding:24px 20px 26px;border-radius:0 0 24px 24px}header small{color:#c7e5d7;letter-spacing:.1em;font-weight:700}header h1{margin:8px 0;font-size:27px}header p{color:#d7e9e1;margin:0}
.wrap{max-width:720px;margin:auto;padding:16px}.nav{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:650;background:#e2eae5;color:var(--green)}button{cursor:pointer}.nav button.active,.btn.primary{background:var(--green);color:white}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}.muted{color:var(--muted);font-size:14px}.bar{height:8px;background:#e6eee9;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#3c9870;width:0}.chapter{width:48px;height:48px;background:var(--mint);border-radius:14px;display:grid;place-items:center;color:var(--green);font-weight:800}.chapterlist button{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0}.pill{display:inline-block;padding:6px 10px;border-radius:100px;background:#edf4ef;color:#377458;font-size:12px;font-weight:700}.key{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5}.key:last-child{border:0}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:14px;padding:14px;margin:8px 0;color:var(--ink);font-size:15px}.option.selected{border:2px solid #36936b;background:#eff8f2}.option.correct{border:2px solid #36936b;background:#eff8f2}.option.wrong{border:2px solid #c85e5e;background:#fff2f2}.big{font-size:22px;font-weight:800}.hidden{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottom button{width:100%;max-width:720px}.success{color:#29815c}.footer{font-size:12px;color:var(--muted);text-align:center;margin:22px 0}
</style>
</head><body>
<header><small>BIOBAC • BAC B1</small><h1>Biologie vegetală și animală</h1><p>Învață materia pentru Bac, pas cu pas.</p></header>
<div class="wrap">
<div class="card"><div class="row"><div class="grow"><strong id="progressText">0/10 capitole parcurse</strong><p class="muted">Progresul se păstrează pe acest dispozitiv.</p></div><div class="big" id="percent">0%</div></div><div class="bar"><span id="progress"></span></div></div>
<div class="nav"><button class="active" onclick="view('lessons',this)">📚 Lecții</button><button onclick="view('quiz',this)">🧠 Test</button><button onclick="view('cards',this)">🗂️ Flashcard-uri</button></div>
<section id="lessons"></section><section id="quiz" class="hidden"></section><section id="cards" class="hidden"></section>
<p class="footer">BioBAC • Material introductiv. Verifică întotdeauna materia cu programa oficială în vigoare.</p>
</div><div class="bottom"><button class="btn primary" onclick="markDone()">✓ Marchează lecția ca parcursă</button></div>
<script>
const M=[
["Celula","Structura, organite, procariote și eucariote","Celula este unitatea structurală, funcțională și genetică a organismelor vii. Celulele procariote nu au nucleu individualizat, iar cele eucariote au nucleu delimitat de membrană.",["Membrana celulară delimitează celula și reglează schimburile.","Citoplasma este mediul intracelular în care se găsesc organitele.","Nucleul conține material genetic și coordonează activitatea celulară.","Mitocondria participă la respirația celulară.","Ribozomii sintetizează proteine.","Cloroplastul este implicat în fotosinteză.","Vacuola contribuie la depozitare și echilibrul osmotic la plante."]],
["Diversitatea lumii vii","Clasificarea organismelor","Organismele vii sunt grupate în categorii pe baza caracteristicilor lor. Clasificarea biologică permite studierea diversității și a relațiilor dintre organisme.",["Virusurile sunt entități acelulare.","Bacteriile sunt organisme procariote.","Protistele sunt un grup divers de organisme eucariote.","Fungii nu realizează fotosinteza și absorb substanțele nutritive.","Plantele sunt în principal autotrofe.","Animalele sunt heterotrofe."]],
["Țesuturi vegetale și animale","Tipuri de țesuturi și funcțiile lor","Țesuturile sunt grupări de celule cu structură și funcție asemănătoare. În organismele pluricelulare, țesuturile contribuie la formarea organelor.",["Țesuturi vegetale: meristematice, de apărare, fundamentale, conducătoare, mecanice și secretoare.","Țesuturi animale: epiteliale, conjunctive, musculare și nervoase.","Țesuturile meristematice participă la creștere.","Țesuturile conducătoare transportă seva.","Țesutul muscular se contractă.","Țesutul nervos recepționează și transmite informații."]],
["Organele vegetale","Rădăcina, tulpina și frunza","Plantele au organe vegetative care asigură nutriția, susținerea, transportul și realizarea schimburilor cu mediul.",["Rădăcina fixează planta și absoarbe apă și săruri minerale.","Tulpina susține organele și transportă substanțe.","Frunza este principalul organ fotosintetic.","Xilemul transportă apă și săruri minerale.","Floemul transportă substanțe organice."]],
["Nutriția plantelor","Fotosinteza, respirația și transpirația","Plantele își produc substanțele organice prin fotosinteză, folosind energia luminoasă. Respirația celulară eliberează energia utilizabilă, iar transpirația contribuie la circulația apei.",["Fotosinteza se desfășoară în cloroplaste.","Fotosinteza folosește dioxid de carbon și apă, în prezența luminii.","Se formează substanțe organice și se eliberează oxigen.","Respirația celulară eliberează energie.","Transpirația reprezintă eliminarea apei sub formă de vapori."]],
["Nutriția la animale","Digestia și sistemul digestiv","Nutriția heterotrofă presupune obținerea substanțelor organice din alte organisme sau din produsele acestora. Digestia transformă alimentele în substanțe absorbabile.",["Digestia poate fi mecanică și chimică.","Digestia începe în cavitatea bucală.","Stomacul participă la digestia proteinelor.","Intestinul subțire este principalul loc al absorbției nutrienților.","Intestinul gros contribuie la absorbția apei."]],
["Respirația","Respirația celulară și sistemul respirator","Respirația celulară reprezintă procesul prin care celulele obțin energie. Sistemul respirator asigură schimbul de gaze dintre organism și mediul extern.",["Respirația aerobă utilizează oxigen.","Mitocondriile au rol esențial în respirația aerobă.","La om, schimburile de gaze au loc la nivelul alveolelor pulmonare.","Oxigenul este transportat prin sânge către țesuturi.","Dioxidul de carbon este eliminat prin expirație."]],
["Circulația și excreția","Sângele, vasele, inima și rinichii","Circulația transportă substanțe în organism. Excreția contribuie la eliminarea produselor de metabolism și la menținerea homeostaziei.",["Sângele este format din plasmă și elemente figurate.","Arterele conduc sângele de la inimă.","Venele conduc sângele către inimă.","Capilarele permit schimburile dintre sânge și țesuturi.","Rinichii filtrează sângele și contribuie la formarea urinei."]],
["Sensibilitatea și mișcarea","Sistemul nervos și organele de simț","Organismele percep stimulii din mediu și răspund prin mecanisme specifice. La animale, sistemul nervos coordonează răspunsurile și contribuie la integrarea informațiilor.",["Neuronul este celula funcțională a sistemului nervos.","Sistemul nervos central include encefalul și măduva spinării.","Receptorii detectează stimuli.","Sistemul muscular permite mișcarea.","Plantele răspund la stimuli prin tropisme și nastii."]],
["Reproducerea","Reproducerea plantelor și animalelor","Reproducerea asigură perpetuarea speciilor. Poate fi asexuată sau sexuată, în funcție de mecanismele implicate.",["Reproducerea asexuată nu presupune fuziunea gametelor.","Reproducerea sexuată presupune formarea și unirea gametelor.","La plantele cu flori, polenizarea precedă fecundația.","Sămânța conține embrionul.","La animale, reproducerea diferă în funcție de specie."]]
];
const Q=[
["Ce organit este implicat în fotosinteză?",["Mitocondria","Cloroplastul","Ribozomul","Nucleul"],1,"Cloroplastul conține pigmenți fotosintetici, inclusiv clorofila."],
["Care țesut transportă apa și sărurile minerale în plante?",["Floemul","Epiderma","Xilemul","Țesutul meristematic"],2,"Xilemul transportă în principal apa și sărurile minerale."],
["Unde au loc schimburile de gaze la nivel pulmonar?",["Trahee","Bronhii","Alveole","Laringe"],2,"Alveolele pulmonare sunt adaptate schimburilor de gaze."],
["Care este unitatea funcțională a sistemului nervos?",["Neuronul","Eritrocitul","Alveola","Nefronul"],0,"Neuronul este celula specializată în recepția și transmiterea informației nervoase."],
["Ce componentă a sângelui participă la coagulare?",["Eritrocitele","Trombocitele","Neuronii","Alveolele"],1,"Trombocitele participă la hemostază și coagulare."],
["Ce proces reprezintă eliminarea vaporilor de apă de către plante?",["Fotosinteza","Fecundația","Transpirația","Germinația"],2,"Transpirația este eliminarea apei sub formă de vapori, în principal prin stomate."],
["Care este principalul loc al absorbției nutrienților la om?",["Stomacul","Intestinul subțire","Esofagul","Faringele"],1,"Intestinul subțire are o suprafață mare de absorbție datorită vilozităților."],
["Ce structură conține materialul genetic al celulei eucariote?",["Nucleul","Peretele celular","Vacuola","Golgi"],0,"Nucleul conține cea mai mare parte a ADN-ului celulei eucariote."],
["Ce tip de reproducere nu presupune unirea gametelor?",["Sexuată","Asexuată","Fecundația","Reproducerea prin gamete"],1,"Reproducerea asexuată nu implică fuziunea gametelor."],
["Ce vase conduc sângele de la inimă către organe?",["Venele","Arterele","Capilarele limfatice","Alveolele"],1,"Arterele conduc sângele de la inimă către țesuturi."]
];
let active=0,quizIndex=0,chosen=-1,answered=false,points=0,quizEnded=false,flashIndex=0,flipped=false;
let done=JSON.parse(localStorage.getItem("biobac_done")||"[]");
function updateProgress(){document.getElementById("progressText").textContent=done.length+"/10 capitole parcurse";document.getElementById("percent").textContent=Math.round(done.length/10*100)+"%";document.getElementById("progress").style.width=done.length*10+"%"}
function renderLessons(){let s=document.getElementById("lessons");s.innerHTML='<h2>Programa de învățare</h2>'+M.map((m,i)=>`<button class="chapterlist" style="display:block" onclick="active=${i};renderLessons()"><div class="row"><div class="chapter">${String(i+1).padStart(2,"0")}</div><div class="grow"><strong>${m[0]}</strong><div class="muted">${m[1]}</div>${done.includes(i)?'<span class="pill">✓ Parcurs</span>':''}</div><span>${active===i?"⌄":"›"}</span></div></button>`).join("")+`<div class="card"><h2>${M[active][0]}</h2><p>${M[active][2]}</p><h3 class="success">Ce trebuie să reții</h3>${M[active][3].map((k,i)=>`<div class="key"><b>${i+1}.</b> ${k}</div>`).join("")}<p><span class="pill">${M[active][1]}</span></p></div>`}
function markDone(){if(!done.includes(active)){done.push(active);localStorage.setItem("biobac_done",JSON.stringify(done));updateProgress();renderLessons()}alert("Capitolul a fost marcat ca parcurs!")}
function view(id,btn){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.querySelector(".bottom").style.display=id==="lessons"?"flex":"none";if(id==="quiz")renderQuiz();if(id==="cards")renderCard()}
function renderQuiz(){let s=document.getElementById("quiz");if(quizEnded){s.innerHTML=`<div class="card"><h2>Test terminat!</h2><div class="big">${points}/10</div><p>${points===10?"Excelent! Ai răspuns corect la toate.":points>=7?"Foarte bine! Repetă întrebările greșite.":"Mai studiază lecțiile și încearcă din nou."}</p><button class="btn primary" onclick="quizIndex=0;chosen=-1;answered=false;points=0;quizEnded=false;renderQuiz()">Reia testul</button></div>`;return}let q=Q[quizIndex];s.innerHTML=`<div class="card"><div class="row"><span class="pill">Întrebarea ${quizIndex+1}/10</span><span class="grow"></span><b>${points} corecte</b></div><div class="bar" style="margin:12px 0"><span style="width:${(quizIndex+1)*10}%"></span></div><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="option ${chosen===i?"selected":""} ${answered&&i===q[2]?"correct":answered&&i===chosen?"wrong":""}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}${answered?`<div class="card"><b class="${chosen===q[2]?"success":""}">${chosen===q[2]?"Corect!":"Răspuns greșit"}</b><p>${q[3]}</p></div><button class="btn primary" onclick="nextQ()">${quizIndex===9?"Vezi rezultatul":"Următoarea întrebare"}</button>`:`<button class="btn primary" ${chosen<0?"disabled":""} onclick="checkAnswer()">Verifică răspunsul</button>`}</div>`}
function selectAnswer(i){if(!answered){chosen=i;renderQuiz()}}
function checkAnswer(){answered=true;if(chosen===Q[quizIndex][2])points++;renderQuiz()}
function nextQ(){if(quizIndex===9)quizEnded=true;else quizIndex++;chosen=-1;answered=false;renderQuiz()}
function renderCard(){let q=Q[flashIndex];document.getElementById("cards").innerHTML=`<div class="card"><span class="pill">Card ${flashIndex+1}/10</span><button class="option" style="min-height:170px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700" onclick="flipped=!flipped">${flipped?q[3]:q[0]}<br><small class="muted">${flipped?"Explicație":"Apasă pentru răspuns"}</small></button><div class="row"><button class="btn" ${flashIndex===0?"disabled":""} onclick="flashIndex--;flipped=false;renderCard()">← Anterior</button><span class="grow"></span><button class="btn primary" ${flashIndex===9?"disabled":""} onclick="flashIndex++;flipped=false;renderCard()">Următor →</button></div></div>`}
renderLessons();updateProgress();document.getElementById("quiz").classList.add("hidden");document.getElementById("cards").classList.add("hidden");
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
