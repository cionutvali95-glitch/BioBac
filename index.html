<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BioBAC"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>BioBAC</title><style>:root{--green:#174b3d;--mint:#d9eee4;--bg:#f4f7f5;--ink:#20352e;--muted:#687b74;--line:#e0e9e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:20px}header{background:var(--green);color:white;padding:24px 20px 26px;border-radius:0 0 24px 24px}header small{color:#c7e5d7;letter-spacing:.1em;font-weight:700}header h1{margin:8px 0;font-size:27px}header p{color:#d7e9e1;margin:0}.wrap{max-width:720px;margin:auto;padding:16px}.nav{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:650;background:#e2eae5;color:var(--green)}button{cursor:pointer}.nav button.active,.btn.primary{background:var(--green);color:white}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}.muted{color:var(--muted);font-size:14px}.bar{height:8px;background:#e6eee9;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#3c9870;width:0}.chapter{width:48px;height:48px;background:var(--mint);border-radius:14px;display:grid;place-items:center;color:var(--green);font-weight:800;flex-shrink:0}.chapterlist button{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0}.pill{display:inline-block;padding:6px 10px;border-radius:100px;background:#edf4ef;color:#377458;font-size:12px;font-weight:700}.key{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.5}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:14px;padding:14px;margin:8px 0;color:var(--ink);font-size:15px}.option.selected{border:2px solid #36936b;background:#eff8f2}.option.correct{border:2px solid #36936b;background:#eff8f2}.option.wrong{border:2px solid #c85e5e;background:#fff2f2}.big{font-size:22px;font-weight:800}.hidden{display:none}.success{color:#29815c}.footer{font-size:12px;color:var(--muted);text-align:center;margin:22px 0}textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:white;color:var(--ink)}.lessonnav{display:flex;gap:10px;margin-top:16px}.lessonnav button{flex:1}.feedback{background:#edf5ef;border-radius:14px;padding:12px;margin-top:12px}.small{font-size:13px}</style></head><body><header><small>BIOBAC • BAC B1</small><h1>Biologie vegetală și animală</h1><p>Învață materia pentru Bac, pas cu pas.</p></header><div class="wrap"><div class="card"><div class="row"><div class="grow"><strong id="progressText">0/10 capitole parcurse</strong><p class="muted">Progresul se păstrează pe acest dispozitiv.</p></div><div class="big" id="percent">0%</div></div><div class="bar"><span id="progress"></span></div></div><div class="nav"><button class="active" onclick="view('lessons',this)">📚 Lecții</button><button onclick="view('quiz',this)">🧠 Test</button><button onclick="view('cards',this)">🗂️ Flashcard-uri</button><button onclick="view('practice',this)">✍️ Exersează BAC</button></div><section id="lessons"></section><section id="quiz" class="hidden"></section><section id="cards" class="hidden"></section><section id="practice" class="hidden"></section><p class="footer">BioBAC • Material de învățare; verifică programa oficială în vigoare.</p></div><script>
const M=[
["Celula","Structura, organite, procariote și eucariote","Celula este unitatea structurală, funcțională și genetică a organismelor vii. Celulele procariote nu au nucleu individualizat, iar cele eucariote au nucleu delimitat de membrană.","Membrana celulară delimitează celula și reglează schimburile.\nCitoplasma este mediul intracelular în care se găsesc organitele.\nNucleul conține material genetic și coordonează activitatea celulară.\nMitocondria participă la respirația celulară.\nRibozomii sintetizează proteine.\nCloroplastul este implicat în fotosinteză.\nVacuola contribuie la depozitare și echilibrul osmotic la plante."],
["Diversitatea lumii vii","Clasificarea organismelor","Organismele vii sunt grupate în categorii pe baza caracteristicilor lor. Clasificarea biologică permite studierea diversității și a relațiilor dintre organisme.","Virusurile sunt entități acelulare.\nBacteriile sunt organisme procariote.\nProtistele sunt un grup divers de organisme eucariote.\nFungii nu realizează fotosinteza și absorb substanțele nutritive.\nPlantele sunt în principal autotrofe.\nAnimalele sunt heterotrofe."],
["Țesuturi vegetale și animale","Tipuri de țesuturi și funcțiile lor","Țesuturile sunt grupări de celule cu structură și funcție asemănătoare. În organismele pluricelulare, țesuturile contribuie la formarea organelor.","Țesuturi vegetale: meristematice, de apărare, fundamentale, conducătoare, mecanice și secretoare.\nȚesuturi animale: epiteliale, conjunctive, musculare și nervoase.\nȚesuturile meristematice participă la creștere.\nȚesuturile conducătoare transportă seva.\nȚesutul muscular se contractă.\nȚesutul nervos recepționează și transmite informații."],
["Organele vegetale","Rădăcina, tulpina și frunza","Plantele au organe vegetative care asigură nutriția, susținerea, transportul și realizarea schimburilor cu mediul.","Rădăcina fixează planta și absoarbe apă și săruri minerale.\nTulpina susține organele și transportă substanțe.\nFrunza este principalul organ fotosintetic.\nXilemul transportă apă și săruri minerale.\nFloemul transportă substanțe organice."],
["Nutriția plantelor","Fotosinteza, respirația și transpirația","Plantele își produc substanțele organice prin fotosinteză, folosind energia luminoasă. Respirația celulară eliberează energia utilizabilă, iar transpirația contribuie la circulația apei.","Fotosinteza se desfășoară în cloroplaste.\nFotosinteza folosește dioxid de carbon și apă, în prezența luminii.\nSe formează substanțe organice și se eliberează oxigen.\nRespirația celulară eliberează energie.\nTranspirația reprezintă eliminarea apei sub formă de vapori."],
["Nutriția la animale","Digestia și sistemul digestiv","Nutriția heterotrofă presupune obținerea substanțelor organice din alte organisme sau din produsele acestora. Digestia transformă alimentele în substanțe absorbabile.","Digestia poate fi mecanică și chimică.\nDigestia începe în cavitatea bucală.\nStomacul participă la digestia proteinelor.\nIntestinul subțire este principalul loc al absorbției nutrienților.\nIntestinul gros contribuie la absorbția apei."],
["Respirația","Respirația celulară și sistemul respirator","Respirația celulară reprezintă procesul prin care celulele obțin energie. Sistemul respirator asigură schimbul de gaze dintre organism și mediul extern.","Respirația aerobă utilizează oxigen.\nMitocondriile au rol esențial în respirația aerobă.\nLa om, schimburile de gaze au loc la nivelul alveolelor pulmonare.\nOxigenul este transportat prin sânge către țesuturi.\nDioxidul de carbon este eliminat prin expirație."],
["Circulația și excreția","Sângele, vasele, inima și rinichii","Circulația transportă substanțe în organism. Excreția contribuie la eliminarea produselor de metabolism și la menținerea homeostaziei.","Sângele este format din plasmă și elemente figurate.\nArterele conduc sângele de la inimă.\nVenele conduc sângele către inimă.\nCapilarele permit schimburile dintre sânge și țesuturi.\nRinichii filtrează sângele și contribuie la formarea urinei."],
["Sensibilitatea și mișcarea","Sistemul nervos și organele de simț","Organismele percep stimulii din mediu și răspund prin mecanisme specifice. La animale, sistemul nervos coordonează răspunsurile și contribuie la integrarea informațiilor.","Neuronul este celula funcțională a sistemului nervos.\nSistemul nervos central include encefalul și măduva spinării.\nReceptorii detectează stimuli.\nSistemul muscular permite mișcarea.\nPlantele răspund la stimuli prin tropisme și nastii."],
["Reproducerea","Reproducerea plantelor și animalelor","Reproducerea asigură perpetuarea speciilor. Poate fi asexuată sau sexuată, în funcție de mecanismele implicate.","Reproducerea asexuată nu presupune fuziunea gametelor.\nReproducerea sexuată presupune formarea și unirea gametelor.\nLa plantele cu flori, polenizarea precedă fecundația.\nSămânța conține embrionul.\nLa animale, reproducerea diferă în funcție de specie."]];
const Q=[["Ce organit este implicat în fotosinteză?",["Mitocondria","Cloroplastul","Ribozomul","Nucleul"],1,"Cloroplastul conține pigmenți fotosintetici, inclusiv clorofila."],["Care țesut transportă apa și sărurile minerale în plante?",["Floemul","Epiderma","Xilemul","Țesutul meristematic"],2,"Xilemul transportă în principal apa și sărurile minerale."],["Unde au loc schimburile de gaze la nivel pulmonar?",["Trahee","Bronhii","Alveole","Laringe"],2,"Alveolele pulmonare sunt adaptate schimburilor de gaze."],["Care este unitatea funcțională a sistemului nervos?",["Neuronul","Eritrocitul","Alveola","Nefronul"],0,"Neuronul este celula specializată în recepția și transmiterea informației nervoase."],["Ce componentă a sângelui participă la coagulare?",["Eritrocitele","Trombocitele","Neuronii","Alveolele"],1,"Trombocitele participă la hemostază."],["Ce proces reprezintă eliminarea vaporilor de apă de către plante?",["Fotosinteza","Fecundația","Transpirația","Germinația"],2,"Transpirația este eliminarea apei sub formă de vapori."],["Care este principalul loc al absorbției nutrienților la om?",["Stomacul","Intestinul subțire","Esofagul","Faringele"],1,"Intestinul subțire are suprafață mare de absorbție."],["Ce structură conține materialul genetic al celulei eucariote?",["Nucleul","Peretele celular","Vacuola","Golgi"],0,"Nucleul conține cea mai mare parte a ADN-ului celulei eucariote."],["Ce tip de reproducere nu presupune unirea gametelor?",["Sexuată","Asexuată","Fecundația","Reproducerea prin gamete"],1,"Reproducerea asexuată nu implică fuziunea gametelor."],["Ce vase conduc sângele de la inimă către organe?",["Venele","Arterele","Capilarele limfatice","Alveolele"],1,"Arterele conduc sângele de la inimă către țesuturi."]];
const P=[{type:'tf',q:'Xilemul transportă în principal apă și săruri minerale de la rădăcină către organele plantei.',a:true,e:'Xilemul este țesutul conducător pentru apă și săruri minerale.'},{type:'fill',q:'Organitul celular în care are loc fotosinteza este ____.',a:'cloroplastul',e:'Cloroplastul conține pigmenți fotosintetici.'},{type:'mc',q:'Care dintre următoarele structuri participă la coagularea sângelui?',opts:['Leucocitele','Trombocitele','Neuronii','Alveolele'],a:1,e:'Trombocitele participă la hemostază.'},{type:'write',q:'Scrieți două funcții ale rădăcinii.',a:['fixare','absorbție'],e:'Exemple de funcții: fixarea plantei în sol și absorbția apei și sărurilor minerale.'},{type:'tf',q:'Venele transportă sângele întotdeauna oxigenat.',a:false,e:'Fals. Majoritatea venelor transportă sânge cu mai puțin oxigen, dar vena pulmonară transportă sânge oxigenat.'},{type:'fill',q:'Schimburile de gaze la nivelul plămânilor au loc în ____.',a:'alveole',e:'Alveolele sunt structuri specializate pentru schimbul gazos.'},{type:'write',q:'Precizați două componente ale sângelui.',a:['plasmă','elemente figurate'],e:'Sângele este format din plasmă și elemente figurate (eritrocite, leucocite și trombocite).'}];
let active=0,quizIndex=0,chosen=-1,answered=false,points=0,quizEnded=false,flashIndex=0,flipped=false,practiceIndex=0,practiceAnswer='',practiceChecked=false;let done=JSON.parse(localStorage.getItem('biobac_done')||'[]');function updateProgress(){document.getElementById('progressText').textContent=done.length+'/10 capitole parcurse';document.getElementById('percent').textContent=Math.round(done.length/10*100)+'%';document.getElementById('progress').style.width=done.length*10+'%'}function renderLessons(){let s=document.getElementById('lessons');s.innerHTML='<h2>Programa de învățare</h2>'+M.map((m,i)=>`<button class="chapterlist" style="display:block" onclick="active=${i};renderLessons()"><div class="row"><div class="chapter">${String(i+1).padStart(2,'0')}</div><div class="grow"><strong>${m[0]}</strong><div class="muted">${m[1]}</div>${done.includes(i)?'<span class="pill">✓ Parcurs</span>':''}</div><span>${active===i?'⌄':'›'}</span></div></button>`).join('')+`<div class="card"><span class="pill">Lecția ${active+1} din ${M.length}</span><h2>${M[active][0]}</h2><p>${M[active][2]}</p><h3 class="success">Ce trebuie să reții</h3>${M[active][3].split('\n').map((k,i)=>`<div class="key"><b>${i+1}.</b> ${k}</div>`).join('')}<div class="lessonnav"><button class="btn" onclick="prevLesson()" ${active===0?'disabled':''}>← Anterior</button><button class="btn primary" onclick="markDone()">✓ Marchează parcursă</button><button class="btn primary" onclick="nextLesson()" ${active===9?'disabled':''}>Următoarea →</button></div></div>`}function prevLesson(){if(active>0)active--;renderLessons()}function nextLesson(){if(active<9)active++;renderLessons();document.getElementById('lessons').scrollIntoView({behavior:'smooth'})}function markDone(){if(!done.includes(active)){done.push(active);localStorage.setItem('biobac_done',JSON.stringify(done));updateProgress()}if(active<9)nextLesson();else renderLessons()}function view(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='quiz')renderQuiz();if(id==='cards')renderCard();if(id==='practice')renderPractice()}function renderQuiz(){let s=document.getElementById('quiz');if(quizEnded){s.innerHTML=`<div class="card"><h2>Test terminat!</h2><div class="big">${points}/10</div><p>${points>=8?'Foarte bine!':points>=5?'Bine, mai repetă!':'Mai studiază și încearcă din nou.'}</p><button class="btn primary" onclick="quizIndex=0;chosen=-1;answered=false;points=0;quizEnded=false;renderQuiz()">Reia testul</button></div>`;return}let q=Q[quizIndex%Q.length];s.innerHTML=`<div class="card"><span class="pill">Întrebarea ${quizIndex+1}/10</span><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="option ${chosen===i?'selected':''} ${answered&&i===q[2]?'correct':answered&&i===chosen?'wrong':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen===q[2]?'Corect!':'Răspuns greșit'}</b><p>${q[3]}</p></div><button class="btn primary" onclick="nextQ()">${quizIndex===9?'Vezi rezultatul':'Următoarea întrebare'}</button>`:`<button class="btn primary" ${chosen<0?'disabled':''} onclick="checkAnswer()">Verifică răspunsul</button>`}</div>`}function selectAnswer(i){if(!answered){chosen=i;renderQuiz()}}function checkAnswer(){answered=true;if(chosen===Q[quizIndex%Q.length][2])points++;renderQuiz()}function nextQ(){if(quizIndex===9)quizEnded=true;else quizIndex++;chosen=-1;answered=false;renderQuiz()}function renderCard(){let q=Q[flashIndex%Q.length];document.getElementById('cards').innerHTML=`<div class="card"><span class="pill">Card ${flashIndex+1}/${Q.length}</span><button class="option" style="min-height:170px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700" onclick="flipped=!flipped;renderCard()">${flipped?q[3]:q[0]}<br><small class="muted">${flipped?'Explicație':'Apasă pentru răspuns'}</small></button><div class="lessonnav"><button class="btn" onclick="flashIndex=(flashIndex+Q.length-1)%Q.length;flipped=false;renderCard()">← Anterior</button><button class="btn primary" onclick="flashIndex=(flashIndex+1)%Q.length;flipped=false;renderCard()">Următor →</button></div></div>`}function renderPractice(){let p=P[practiceIndex%P.length],s=document.getElementById('practice');let input=p.type==='tf'?`<div class="row"><button class="btn" onclick="practiceAnswer='true';renderPractice()">Adevărat</button><button class="btn" onclick="practiceAnswer='false';renderPractice()">Fals</button></div>`:p.type==='mc'?p.opts.map((o,i)=>`<button class="option ${practiceAnswer==i?'selected':''}" onclick="practiceAnswer=${i};renderPractice()">${String.fromCharCode(65+i)}. ${o}</button>`).join(''):`<textarea rows="4" placeholder="Scrie răspunsul aici…" oninput="practiceAnswer=this.value">${practiceAnswer}</textarea>`;s.innerHTML=`<div class="card"><span class="pill">Exercițiul ${practiceIndex+1}/${P.length} • tip BAC</span><h3>${p.q}</h3>${input}<button class="btn primary" style="margin-top:12px" onclick="practiceChecked=true;renderPractice()">Verifică</button>${practiceChecked?`<div class="feedback"><b>Explicație:</b><p>${p.e}</p><p class="small">${p.type==='tf'?'Ai ales: '+(practiceAnswer==='true'?'Adevărat':'Fals'):p.type==='mc'?'Verifică varianta selectată cu explicația.':'Compară răspunsul tău cu elementele de mai jos.'}</p>${p.type==='write'?`<p>Elemente de răspuns: ${p.a.join(', ')}</p>`:''}</div>`:''}<div class="lessonnav"><button class="btn" onclick="practiceIndex=(practiceIndex+P.length-1)%P.length;practiceAnswer='';practiceChecked=false;renderPractice()">← Anterior</button><button class="btn primary" onclick="practiceIndex=(practiceIndex+1)%P.length;practiceAnswer='';practiceChecked=false;renderPractice()">Următor →</button></div></div>`}renderLessons();updateProgress();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
